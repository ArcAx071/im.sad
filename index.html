<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>After All This Time — Aditi</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        height: 100vh;
        overflow: hidden;
        font-family: Georgia, serif;
        background: #090514;
        color: white;
    }

    .scene {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(circle at 50% 35%, #5b315f 0%, #21152f 35%, #090514 75%);
    }

    /* Moon */
    .moon {
        position: absolute;
        top: 10%;
        right: 13%;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: #fff4d6;
        box-shadow: 0 0 45px #fff4d6;
    }

    /* Stars */
    .stars {
        position: absolute;
        inset: 0;
        background-image:
            radial-gradient(circle, white 1px, transparent 1px),
            radial-gradient(circle, #ffd9ec 1px, transparent 1px);
        background-size: 90px 90px, 140px 140px;
        background-position: 10px 20px, 50px 70px;
        opacity: .65;
    }

    /* Ground */
    .ground {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 30%;
        background: linear-gradient(#15101e, #050309);
        clip-path: polygon(0 35%, 15% 20%, 30% 35%, 45% 15%,
                           60% 32%, 75% 18%, 100% 35%, 100% 100%, 0 100%);
    }

    .intro {
        position: relative;
        z-index: 5;
        text-align: center;
        max-width: 700px;
        padding: 30px;
        animation: fadeIn 2s ease;
    }

    .date {
        letter-spacing: 5px;
        text-transform: uppercase;
        font-size: 12px;
        opacity: .65;
        margin-bottom: 20px;
    }

    h1 {
        font-size: clamp(42px, 8vw, 90px);
        font-weight: normal;
        margin-bottom: 15px;
        text-shadow: 0 0 25px rgba(255,180,220,.5);
    }

    .subtitle {
        font-size: 20px;
        color: #e8cddd;
        min-height: 60px;
        line-height: 1.6;
    }

    button {
        margin-top: 35px;
        padding: 14px 30px;
        border: 1px solid rgba(255,255,255,.4);
        border-radius: 30px;
        background: rgba(255,255,255,.08);
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: .3s;
        backdrop-filter: blur(10px);
    }

    button:hover {
        transform: scale(1.08);
        background: rgba(255,255,255,.18);
        box-shadow: 0 0 30px rgba(255,170,220,.35);
    }

    /* Meeting scene */
    .meeting {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 10;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(circle at 50% 45%, #70415d, #120b1b 65%);
    }

    .meeting.active {
        display: flex;
        animation: fadeIn 2s ease;
    }

    .person {
        position: absolute;
        bottom: 18%;
        text-align: center;
    }

    .you {
        left: 17%;
    }

    .aditi {
        right: 17%;
    }

    .silhouette {
        width: 100px;
        height: 170px;
        margin: auto;
        position: relative;
    }

    .head {
        width: 55px;
        height: 55px;
        background: #15101a;
        border-radius: 50%;
        margin: auto;
    }

    .body {
        width: 100px;
        height: 120px;
        background: #15101a;
        border-radius: 50px 50px 0 0;
        margin-top: -5px;
    }

    .person-name {
        margin-top: 15px;
        font-size: 18px;
        letter-spacing: 2px;
    }

    .message {
        position: absolute;
        top: 14%;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 700px;
        text-align: center;
        font-size: clamp(22px, 4vw, 38px);
        line-height: 1.5;
        color: #ffe9f4;
    }

    .heart {
        position: absolute;
        left: 50%;
        bottom: 38%;
        transform: translateX(-50%);
        font-size: 35px;
        opacity: 0;
    }

    .heart.show {
        animation: heartFloat 3s ease forwards;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: scale(.97); }
        to { opacity: 1; transform: scale(1); }
    }

    @keyframes heartFloat {
        0% { opacity: 0; transform: translate(-50%, 30px) scale(.5); }
        30% { opacity: 1; }
        100% {
            opacity: 0;
            transform: translate(-50%, -100px) scale(1.5);
        }
    }

    @media (max-width: 600px) {
        .you { left: 7%; }
        .aditi { right: 7%; }

        .silhouette {
            transform: scale(.75);
        }
    }
</style>
</head>

<body>

<div class="scene">

    <div class="stars"></div>
    <div class="moon"></div>
    <div class="ground"></div>

    <div class="intro">
        <div class="date">A moment we waited for</div>

        <h1>Aditi</h1>

        <div class="subtitle" id="typing"></div>

        <button onclick="meet()">Walk to her</button>
    </div>

</div>

<div class="meeting" id="meeting">

    <div class="message" id="message">
        After all this time...
    </div>

    <div class="person you">
        <div class="silhouette">
            <div class="head"></div>
            <div class="body"></div>
        </div>
        <div class="person-name">YOU</div>
    </div>

    <div class="person aditi">
        <div class="silhouette">
            <div class="head"></div>
            <div class="body"></div>
        </div>
        <div class="person-name">ADITI</div>
    </div>

    <div class="heart" id="heart">♥</div>

</div>

<script>

const text =
    "Some people leave your life for a while... " +
    "but somehow, your heart never forgets where they belong.";

let i = 0;

function typeWriter() {
    if (i < text.length) {
        document.getElementById("typing").textContent += text.charAt(i);
        i++;
        setTimeout(typeWriter, 45);
    }
}

typeWriter();

function meet() {

    document.querySelector(".scene").style.display = "none";

    const meeting = document.getElementById("meeting");
    meeting.classList.add("active");

    setTimeout(() => {
        document.getElementById("message").textContent =
            "And then... there she was. Aditi.";

    }, 1500);

    setTimeout(() => {
        document.getElementById("message").textContent =
            "For a moment, the years between you disappeared.";

    }, 4000);

    setTimeout(() => {
        document.getElementById("message").textContent =
            "Some reunions don't need words.";

        document.getElementById("heart").classList.add("show");

    }, 7000);

    setTimeout(() => {
        document.getElementById("message").textContent =
            "“I missed you.”";

    }, 10000);
}

</script>

</body>
</html>
